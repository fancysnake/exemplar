[project]
name = "exemplar"
version = "0.1.0"
description = "One set of standards across many repositories, checked in each repository's CI"
authors = [{ name = "Radosław Ganczarek", email = "radoslaw@ganczarek.in" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["typer (>=0.27.2,<1.0.0)"]

[project.scripts]
exemplar = "exemplar.inits.cli:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "exemplar", from = "src" }]

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "codespell (>=2.4.2,<3.0.0)",
    "deptry (>=0.25.1,<0.26.0)",
    "import-linter (>=2.11,<3.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pylint (>=4.0.5,<5.0.0)",
    "ruff (>=0.16.0,<0.17.0)",
    "vulture (>=2.16,<3.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "diff-cover (>=10.2.0,<11.0.0)",
    "taplo (>=0.9.3,<0.10.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "yamllint (>=1.37,<2.0)",
    "tingle (>=0.8.0,<0.9.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    # Not on PyPI; git is its only source. Brings vekna, which casts it.
    "cabinet @ git+https://github.com/fancysnake/cabinet.git@v3.0.0",
]

# Only `site:*` and the site workflow install this one — nothing else needs a
# static-site generator to run the tests, so the group is marked optional
# below: that is what a plain `poetry install` — the mise enter hook, and CI
# before it runs anything but `site:*` — leaves out. `--only docs` and
# `--with docs` are the opt-in.
docs = ["mkdocs-material (>=9.6,<10.0)"]
[tool.poetry.group.docs]
optional = true

# BLACK

[tool.black]
line-length = 88
preview = true
skip-magic-trailing-comma = true
target-version = ['py314']

# DEPTRY

[tool.deptry]
known_first_party = ["exemplar"]

# IMPORT LINTER

[tool.importlinter]
root_package = "exemplar"

[[tool.importlinter.contracts]]
name = "gates"
type = "forbidden"
source_modules = ["exemplar.gates"]
forbidden_modules = [
    "exemplar.links",
    "exemplar.inits",
    "exemplar.mills",
    "exemplar.specs",
    "exemplar.edges",
]

[[tool.importlinter.contracts]]
name = "links"
type = "forbidden"
source_modules = ["exemplar.links"]
forbidden_modules = [
    "exemplar.gates",
    "exemplar.inits",
    "exemplar.mills",
    "exemplar.specs",
    "exemplar.edges",
]

[[tool.importlinter.contracts]]
name = "inits"
type = "forbidden"
source_modules = ["exemplar.inits"]
forbidden_modules = ["exemplar.specs", "exemplar.edges"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "mills"
type = "forbidden"
source_modules = ["exemplar.mills"]
forbidden_modules = [
    "exemplar.gates",
    "exemplar.links",
    "exemplar.inits",
    "exemplar.edges",
]

[[tool.importlinter.contracts]]
name = "pacts"
type = "forbidden"
source_modules = ["exemplar.pacts"]
forbidden_modules = [
    "exemplar.gates",
    "exemplar.links",
    "exemplar.inits",
    "exemplar.mills",
    "exemplar.specs",
    "exemplar.edges",
]

[[tool.importlinter.contracts]]
name = "specs"
type = "forbidden"
source_modules = ["exemplar.specs"]
forbidden_modules = [
    "exemplar.gates",
    "exemplar.links",
    "exemplar.inits",
    "exemplar.mills",
    "exemplar.edges",
]

[[tool.importlinter.contracts]]
name = "edges"
type = "forbidden"
source_modules = ["exemplar.edges"]
forbidden_modules = [
    "exemplar.gates",
    "exemplar.links",
    "exemplar.inits",
    "exemplar.mills",
    "exemplar.pacts",
    "exemplar.specs",
]

[[tool.importlinter.contracts]]
name = "inside-gates"
type = "independence"
modules = ["exemplar.gates.*"]

# MYPY

[tool.mypy]
color_output = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_unimported = true
exclude = []
explicit_package_bases = true
mypy_path = "src"
pretty = true
python_version = "3.14"
strict = true
strict_equality_for_none = true
warn_incomplete_stub = true
warn_unreachable = true

# PYLINT

[tool.pylint.main]
ignore = ["CVS", "migrations"]
load-plugins = [
    "pylint.extensions.bad_builtin",
    "pylint.extensions.check_elif",
    "pylint.extensions.code_style",
    "pylint.extensions.comparison_placement",
    "pylint.extensions.consider_refactoring_into_while_condition",
    "pylint.extensions.consider_ternary_expression",
    "pylint.extensions.dict_init_mutate",
    "pylint.extensions.docparams",
    "pylint.extensions.docstyle",
    "pylint.extensions.dunder",
    "pylint.extensions.empty_comment",
    "pylint.extensions.eq_without_hash",
    "pylint.extensions.for_any_all",
    "pylint.extensions.mccabe",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.private_import",
    "pylint.extensions.redefined_loop_name",
    "pylint.extensions.redefined_variable_type",
    "pylint.extensions.set_membership",
    "pylint.extensions.typing",
    "pylint.extensions.while_used",
]
py-version = "3.14"

[tool.pylint.format]
max-line-length = 88

[tool.pylint."messages control"]
disable = [
    "import-outside-toplevel",
    "simplify-boolean-expression",
    "too-many-public-methods",
    "too-many-branches",
    "too-many-lines",
    "too-many-locals",
    "too-many-ancestors",
    "too-many-return-statements",
    "unused-argument",
    "invalid-str-returned",
    "line-too-long",
    "duplicate-code",
    "protected-access",
    "too-many-positional-arguments",
    "too-many-arguments",
    "too-few-public-methods",
    "too-many-statements",
    "no-member",
    "missing-docstring",
]

[tool.pylint.reports]
output-format = "parseable"

# RUFF

[tool.ruff]
line-length = 88
output-format = 'concise'
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Trailing comma missing
    "CPY",     # Missing copyright notice at top of file
    "D1",      # Missing docstring
    "PLC2701", # Private name import
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "ANN",                    # flake8-annotations
    "S",
    "pytest-fixture-autouse",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# VULTURE

[tool.vulture]
exclude = []
min_confidence = 61

# PYTEST

[tool.pytest.ini_options]
testpaths = ["tests"]

# COVERAGE

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/exemplar/edges/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]
precision = 2

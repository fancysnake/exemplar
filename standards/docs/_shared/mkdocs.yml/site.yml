---
strict: true
validation:
  anchors: warn
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
  features:
    - content.code.copy
    - navigation.top
markdown_extensions:
  - toc: {permalink: true}

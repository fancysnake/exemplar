---
name: exemplar check

"on":
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # exemplar checks itself with the action it has checked out, so its pull
      # request knows the categories and variants that pull request adds.
      # The branch lives here because `exemplar.yml` must match the ci
      # standard's copy byte for byte.
      - if: github.repository == 'fancysnake/exemplar'
        uses: ./
      - if: github.repository != 'fancysnake/exemplar'
        uses: fancysnake/exemplar@main
